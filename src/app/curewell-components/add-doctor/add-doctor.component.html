<div class="row title">
  <h2 align="center">Add a new Doctor</h2>
</div>
<form align="center" #addDoctorForm="ngForm" (ngSubmit)="addDoctor(doctorName)">
  <table align="center">
    <tr>
      <th align="justify"> <label>Doctor Name</label> </th>
      <th>
        <input type="text" id="add_doctorName" class="form-control cwinput" name="doctorName"
               required [(ngModel)]="doctorName" #doctorNameField="ngModel"
               (ngModelChange)="toggleButton = doctorNameField.invalid">

         <div id="add_validate_doctorName" class="text-danger-validation"
              *ngIf="doctorNameField.invalid && doctorNameField.touched && doctorNameField.dirty">
            Name is required
          </div>
      </th>
    </tr>
    <tr>
      <th></th>
      <th align="justify">
        <button class="btn" type="submit" [disabled]="toggleButton">Add Doctor</button>&nbsp;&nbsp;
        <a routerLink="/viewDoctors" routerLinkActive="active">Cancel</a>
      </th>

  </table>
  <div *ngIf="showDiv" style="color:red;text-align:center;">
    {{msg}}
  </div>
</form>
